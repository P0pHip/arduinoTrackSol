<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="316" class="sch" viewBox="0 0 800 316" role="img" aria-label="Bornier des capteurs de lumière, couleurs côté câble. Code : fil de couleur = SDA, fil bleu de la paire = SCL, marron = +3V3, noir = GND. Armoire métal : 1 blanc SDA N, 2 bleu SCL N, 3 jaune SDA E, 4 bleu SCL E, 5 bleu foncé SDA S, 6 bleu SCL S, 7 rouge SDA O, 8 bleu SCL O, 9 marron +3V3, 10 noir GND. Boîtier gris, lecture photo : 1 bleu, 2 blanc, 3 bleu, 4 jaune, 5 bleu, 6 bleu foncé, 7 bleu, 8 marron, 9 noir, 10 rouge, bornes 7 à 10 à vérifier."><title>Bornier des capteurs de lumière, couleurs côté câble. Code : fil de couleur = SDA, fil bleu de la paire = SCL, marron = +3V3, noir = GND. Armoire métal : 1 blanc SDA N, 2 bleu SCL N, 3 jaune SDA E, 4 bleu SCL E, 5 bleu foncé SDA S, 6 bleu SCL S, 7 rouge SDA O, 8 bleu SCL O, 9 marron +3V3, 10 noir GND. Boîtier gris, lecture photo : 1 bleu, 2 blanc, 3 bleu, 4 jaune, 5 bleu, 6 bleu foncé, 7 bleu, 8 marron, 9 noir, 10 rouge, bornes 7 à 10 à vérifier.</title><style>svg { color: #1c2624; font-family: "Barlow", "Segoe UI", system-ui, sans-serif; }
.sch text { font-family: "JetBrains Mono", Consolas, "Courier New", monospace; font-size: 12px; fill: #1c2624; }
.sch .h { font-family: "Barlow", "Segoe UI", system-ui, sans-serif; font-weight: 600; font-size: 14px; }
.sch .m { fill: #5d6b67; font-size: 11px; }
.sch .pt { fill: #b8322a; font-weight: 500; }
.sch .ot { fill: #a8740c; font-family: "Barlow", "Segoe UI", system-ui, sans-serif; font-weight: 600; font-size: 11px; letter-spacing: .08em; }
.sch .box { fill: #fbfcfa; stroke: currentColor; stroke-width: 1.5; }
.sch .chip { fill: #e3ebe7; }
.sch .w { stroke: currentColor; stroke-width: 1.5; fill: none; }
.sch .p { stroke: #b8322a; stroke-width: 2; fill: none; }
.sch .o { stroke: #a8740c; stroke-width: 1.5; stroke-dasharray: 6 4; fill: none; }
.sch .dot { fill: currentColor; }
.sch .pdot { fill: #b8322a; }
.sch .hole { fill: #fbfcfa; stroke: currentColor; stroke-width: 1.5; }
.sch .halo { stroke: currentColor; stroke-width: 8; fill: none; stroke-linejoin: round; }
.sch .fil { stroke-width: 5; fill: none; stroke-linejoin: round; }
.sch .gaine { fill: currentColor; }
.sch .unk { stroke: #5d6b67; stroke-width: 5; stroke-dasharray: 4 3; fill: none; }
.sch .tiny { font-size: 10px; }
.sch .mu { fill: #5d6b67; opacity: .75; }
.sch .pin { fill: currentColor; }
.sch .pinu { fill: #fbfcfa; stroke: #5d6b67; stroke-width: 1; }
.sch .gap { stroke: #fbfcfa; stroke-width: 6; fill: none; }
.sch .bw { stroke: currentColor; stroke-width: 1.6; fill: none; }
.sch .cgap { stroke: #fbfcfa; stroke-width: 9; fill: none; stroke-linejoin: round; }
.sch .cout { stroke: currentColor; stroke-width: 6.5; fill: none; stroke-linejoin: round; }
.sch .cfil { stroke-width: 4.5; fill: none; stroke-linejoin: round; }
.sch .modv { fill: #e3ebe7; stroke: currentColor; stroke-width: 1.5; }
.sch .modb { fill: #dbe6f5; stroke: currentColor; stroke-width: 1.5; }
.sch .modr { fill: #f3dcdc; stroke: currentColor; stroke-width: 1.5; }
.sch .modf { fill: #fbfcfa; stroke: currentColor; stroke-width: 1.5; }
.sch .conn { fill: #c9d1cd; stroke: currentColor; stroke-width: 1; }
.sch .screw { fill: #cfe8d2; stroke: currentColor; stroke-width: 1; }
.sch .gaine { fill: #c9d1cd; stroke: currentColor; stroke-width: 1.5; }
.sch .gt { font-family: "Barlow", "Segoe UI", system-ui, sans-serif; font-size: 12px; }</style><rect x="0" y="0" width="800" height="316" fill="#fbfcfa"/>
