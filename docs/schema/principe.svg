<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="870" class="sch" viewBox="0 0 1240 870" role="img" aria-label="Schéma d'un tracker : l'ESP32 pilote deux drivers BTS7960 reliés aux moteurs Est-Ouest et inclinaison, lit quatre BH1750 via un multiplexeur TCA9548A sur l'I2C, quatre fins de course câblées vers la masse, et sur le maître un anémomètre à contact reed sur GPIO34 avec pull-up 10 kΩ. Alimentation : V_MOT fusible vers les BTS, convertisseur 5 V vers ESP32 et logique BTS, 3,3 V vers les capteurs."><title>Schéma d'un tracker : l'ESP32 pilote deux drivers BTS7960 reliés aux moteurs Est-Ouest et inclinaison, lit quatre BH1750 via un multiplexeur TCA9548A sur l'I2C, quatre fins de course câblées vers la masse, et sur le maître un anémomètre à contact reed sur GPIO34 avec pull-up 10 kΩ. Alimentation : V_MOT fusible vers les BTS, convertisseur 5 V vers ESP32 et logique BTS, 3,3 V vers les capteurs.</title><style>svg { color: #1c2624; font-family: "Barlow", "Segoe UI", system-ui, sans-serif; }
.sch text { font-family: "JetBrains Mono", Consolas, "Courier New", monospace; font-size: 12px; fill: #1c2624; }
.sch .h { font-family: "Barlow", "Segoe UI", system-ui, sans-serif; font-weight: 600; font-size: 14px; }
.sch .m { fill: #5d6b67; font-size: 11px; }
.sch .pt { fill: #b8322a; font-weight: 500; }
