.sch .cout { stroke: currentColor; stroke-width: 6.5; fill: none; stroke-linejoin: round; }
.sch .cfil { stroke-width: 4.5; fill: none; stroke-linejoin: round; }
.sch .modv { fill: #e3ebe7; stroke: currentColor; stroke-width: 1.5; }
.sch .modb { fill: #dbe6f5; stroke: currentColor; stroke-width: 1.5; }
.sch .modr { fill: #f3dcdc; stroke: currentColor; stroke-width: 1.5; }
.sch .modf { fill: #fbfcfa; stroke: currentColor; stroke-width: 1.5; }
